  title: Backwards-compatibility anchoring via a pinned 'legacy' level preserves opt-out while raising defaults
  description: When introducing a multi-level richness/verbosity system to an existing command, dedicate one named level (e.g.
    'compact') as a byte-for-byte reproduction of the pre-change behaviour with every numeric minimum, inclusion rule, and
    surfacing policy pinned to current values. The default-when-unspecified shifts to a richer level ('default'), so existing
    users who don't specify a level get the improved behaviour, while users who need the old behaviour can explicitly select
    the legacy level. Eval tests pin the legacy level's numeric values as regression assertions.
