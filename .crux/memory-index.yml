- id: d55bdbd
  slug: cross-surface-field-name-consistency-canonical-wins
  title: Cross-surface field-name consistency requires canonical-name-wins enforcement across read, write, and schema layers
  description: 'When a structured payload (e.g. YAML artefact) is written by one agent surface and read by another, the field
    name must be identical across three layers: the write-side prose (agent definition), the schema definition (canonical),
    and the read-side contract (command/skill). The 20260523 spec''s W1 finding showed that a divergence between the write-side
    prose (''additional_focus_areas_accepted[]'') and the canonical schema (''additional_focus_areas[]'') caused the report-side
    read contract to silently no-op. The integrity reviewer caught it; the judge upgraded it to soft-BLOCKER. Fix: always
    grep the canonical field name across all three surfaces after any schema-touching subtask completes.'
