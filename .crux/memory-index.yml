- id: 6415c52
  slug: shared-agent-runs-per-describe-block-reduce-api-cost
  title: Shared-agent-runs-per-describe-block reduce LLM eval cost from N agent calls to 1
  description: 'Pattern: in vitest, run a single agent.send() in beforeAll, store the CollectedRun in a describe-scoped variable,
    and have N it() blocks each assert different aspects of that single run''s output. This collapses what would otherwise
    be N x ~60-90s API calls into 1 x ~60-90s for the whole scenario — typical reduction is 3-6x cost and wall-clock time
    per describe block. Used successfully in b-dream (B1/B2/B3 each share one run) and q-meditate (Q1 shares 2-turn setup+meditate).
    Trade-off: if the shared run fails, all N tests fail together; descriptive error messages per assertion partially mitigate
    this. Use only when assertions are read-only (no side effects from one assertion to the next) or all check the same agent
    turn''s output. Distinct from a single it() with multiple expects — separate it()s give per-assertion failure reporting.'
  type: learning
  strength: 1
  references: 0
