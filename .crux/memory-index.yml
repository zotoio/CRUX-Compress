- id: 6265f8f
  slug: sdk-rate-limit-retry-with-exponential-backoff-and-jitter
  title: Exponential backoff with jitter on rate-limit errors is the right concurrency mitigation for parallel SDK forks
  description: 'When running concurrent agent.send() calls across vitest forks (pool: ''forks'', maxForks: 2+), API rate limits
    are inevitable on long suites. Wrap agent.send() with sendWithRetry() that uses exponential backoff (BASE_DELAY_MS=2000,
    MAX_DELAY_MS=60000, DEFAULT_MAX_RETRIES=5) plus ±15% jitter to avoid thundering-herd retries. Detect rate-limit by checking
    the error message for ''rate limit'', ''rate_limit'', ''429'', ''too many requests'', or ''throttl'' (case-insensitive).
    Throw non-rate-limit errors immediately so real bugs aren''t masked. Pair with conservative starting parallelism (maxForks:
    2, scale empirically) — fewer concurrent sessions reduces retry pressure.'
  type: learning
