- id: 91b0e75
  slug: respawn-protocols-share-existing-iteration-budget
  title: Respawn protocols that share an existing iteration budget avoid infinite loops without a separate cap
  description: 'When extending an adversarial review cycle with a new respawn cause (e.g. report-skill respawn for missing
    sections, accepted finalisation enhancements), fold the respawn into the existing ≤N iteration cap rather than introducing
    a separate retry budget. Each respawn consumes one iteration slot; multiple respawn causes in the same iteration bundle
    into a single respawn with a list-typed ''respawn_reasons'' field. At the final iteration, unresolved respawn-triggering
    findings become ESCALATE rather than retrying. This guarantees finite termination with a simple proof: max useful respawns
    = N-1.'
