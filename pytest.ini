[pytest]
testpaths = evals
markers =
    crux_command_smoke: fast deterministic tests, safe for CI smoke run (no LLM required)
    context_reduction_smoke: fast deterministic context-reduction surface tests, safe for CI smoke run
    llm_driven: requires a live LLM call; inherently non-deterministic; flaky-allowed
    flaky: test may have non-deterministic results; install pytest-rerunfailures for reruns support
