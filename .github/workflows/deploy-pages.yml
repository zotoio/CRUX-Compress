name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'web/compress.md/**'
  # Triggered after Release workflow completes successfully
  workflow_run:
    workflows: ["Release"]
    types: [completed]
    branches: [main]
  # Manual trigger
  workflow_dispatch:

# Sets permissions for GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skip runs queued between in-progress and latest
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Only run if Release workflow succeeded, direct push to web/, or manual trigger
    if: |
      github.event_name == 'workflow_dispatch' || 
      github.event_name == 'push' ||
      github.event.workflow_run.conclusion == 'success'
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare site with release files
        run: |
          SITE_DIR="web/compress.md"
          VERSION=$(jq -r '.version' .crux/crux.json)
          echo "Preparing site for v${VERSION}"

          # Copy spec and install guide to site root
          cp CRUX.md "${SITE_DIR}/CRUX.md"
          cp install.crux.md "${SITE_DIR}/install.crux.md"

          # Create llms.txt (copy of CRUX.md for LLM discovery)
          cp CRUX.md "${SITE_DIR}/llms.txt"

          # Generate version.json for dynamic footer updates
          echo "{\"version\":\"${VERSION}\"}" > "${SITE_DIR}/version.json"

          echo "Site files:"
          ls -la "${SITE_DIR}/CRUX.md" "${SITE_DIR}/install.crux.md" "${SITE_DIR}/llms.txt" "${SITE_DIR}/version.json"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'web/compress.md'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Summary
        run: |
          VERSION=$(jq -r '.version' .crux/crux.json)
          echo "## Pages Deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**URL**: ${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: v${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Release files copied to site root**:" >> $GITHUB_STEP_SUMMARY
          echo "- CRUX.md (specification)" >> $GITHUB_STEP_SUMMARY
          echo "- install.crux.md (install guide)" >> $GITHUB_STEP_SUMMARY
          echo "- llms.txt (LLM discovery)" >> $GITHUB_STEP_SUMMARY
          echo "- version.json (dynamic version)" >> $GITHUB_STEP_SUMMARY
