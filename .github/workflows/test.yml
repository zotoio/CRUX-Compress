name: Test

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install bats
        run: npm install -g bats

      - name: Run bats tests
        run: bats tests/*.bats

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python test dependencies
        run: pip install -r evals/requirements.txt

      - name: Run pytest (evals)
        run: pytest evals/ -v --tb=short

      - name: Run pytest (plugin)
        run: pytest plugins/zoto-spec-system/tests/ -v --tb=short

      - name: Validate zip creation
        run: |
          python3 scripts/create-crux-zip.py /tmp
          
          # Verify zip was created
          ZIP_FILE=$(ls /tmp/CRUX-Compress-v*.zip 2>/dev/null || echo "")
          if [[ -z "$ZIP_FILE" ]]; then
            echo "ERROR: Zip file was not created"
            exit 1
          fi
          
          echo "Created: $ZIP_FILE"
          
          # Verify required files are in the zip
          REQUIRED_FILES=(
            "CRUX.md"
            "AGENTS.crux.md"
            ".crux/crux.json"
            ".cursor/hooks.json"
            ".cursor/agents/crux-cursor-rule-manager.md"
            ".cursor/commands/crux-compress.md"
            ".cursor/hooks/crux-detect-changes.py"
            ".cursor/hooks/crux-session-start.py"
            ".cursor/rules/_CRUX-RULE.mdc"
            ".cursor/skills/crux-utils/SKILL.md"
            ".cursor/skills/crux-utils/scripts/crux-utils.py"
          )
          
          for file in "${REQUIRED_FILES[@]}"; do
            if ! unzip -l "$ZIP_FILE" | grep -q "$file"; then
              echo "ERROR: Missing required file in zip: $file"
              exit 1
            fi
            echo "OK: $file"
          done
          
          echo "All required files present in zip"

      - name: Validate install script syntax
        run: |
          bash -n install.sh
          echo "Install script syntax OK"

      - name: Test install script help
        run: bash install.sh --help

      - name: Summary
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All tests passed:" >> $GITHUB_STEP_SUMMARY
          echo "- bats tests (install.sh, scripts)" >> $GITHUB_STEP_SUMMARY
          echo "- pytest suite (evals/)" >> $GITHUB_STEP_SUMMARY
          echo "- pytest plugin tests (plugins/zoto-spec-system/)" >> $GITHUB_STEP_SUMMARY
          echo "- Zip creation validation" >> $GITHUB_STEP_SUMMARY
          echo "- Install script syntax check" >> $GITHUB_STEP_SUMMARY

  shellcheck:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.'
          ignore_paths: >-
            web
          severity: warning
