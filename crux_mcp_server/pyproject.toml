[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crux-mcp-server"
version = "0.1.0"
description = "MCP server providing read-only access to the CRUX memory corpus"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0",
    "pyyaml>=6.0",
    "watchdog>=4.0",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=2.0"]

[project.scripts]
crux-mcp-server = "crux_mcp_server.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["crux_mcp_server"]
